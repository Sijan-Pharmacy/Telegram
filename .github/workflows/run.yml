name: Run SkyGen Telegram Bot

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: "Previous run ID (set automatically during handoff)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    steps:
      - name: Checkout bot code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run SkyGen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DB_REPO_NAME: ${{ secrets.DB_REPO_NAME }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          WORKFLOW_FILE: run.yml
        run: bash start.sh
